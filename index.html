<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khulna Route Optimizer & CNG Network</title>
    
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vis-Network for graph visualization -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        #network-container { width: 100%; height: 100%; min-height: 500px; }
        .vis-network:focus { outline: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden">

    <aside class="w-full md:w-80 lg:w-96 bg-white shadow-xl flex flex-col z-10 p-6 overflow-y-auto">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Khulna Network Optimizer</h1>
        <p class="text-sm text-slate-500 mb-6">Find shortest routes and optimized infrastructure mapping.</p>
        
        <div class="space-y-5">
            <!-- Dijkstra Controls -->
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <h2 class="text-lg font-semibold text-blue-900 mb-3">Fastest Route (Dijkstra)</h2>
                
                <div class="flex flex-col gap-3 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-blue-800 mb-1">Start Location</label>
                        <select id="start-node" class="w-full p-2 border border-blue-200 rounded focus:ring focus:ring-blue-200 text-sm">
                            <!-- Populated via JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-blue-800 mb-1">End Location</label>
                        <select id="end-node" class="w-full p-2 border border-blue-200 rounded focus:ring focus:ring-blue-200 text-sm">
                            <!-- Populated via JS -->
                        </select>
                    </div>
                </div>
                
                <button id="btn-shortest-path" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                    Find Shortest Path
                </button>
            </div>

            <!-- MST Controls -->
            <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                <h2 class="text-lg font-semibold text-green-900 mb-3">CNG Network (MST)</h2>
                <p class="text-xs text-green-700 mb-4">Calculate the most efficient way to connect all locations without redundant loops.</p>
                
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-green-800 mb-1">Algorithm</label>
                    <select id="mst-algo" class="w-full p-2 border border-green-200 rounded focus:ring focus:ring-green-200 text-sm">
                        <option value="kruskal">Kruskal's Algorithm</option>
                        <option value="prim">Prim's Algorithm</option>
                    </select>
                </div>

                <button id="btn-mst" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                    Establish Network
                </button>
            </div>

            <!-- General Controls -->
            <div class="pt-2">
                <button id="btn-reset" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-lg transition-colors">
                    Reset Graph
                </button>
            </div>

            <!-- Results Display -->
            <div id="result-box" class="mt-4 p-4 bg-slate-900 text-white rounded-xl shadow-inner hidden">
                <h3 class="text-sm font-semibold text-slate-400 mb-1" id="result-title">Result</h3>
                <p class="text-2xl font-bold" id="result-value">0.0 km</p>
                <p class="text-xs text-slate-300 mt-2" id="result-details"></p>
            </div>
        </div>
    </aside>

    <main class="flex-1 relative bg-slate-50">
        <!-- Container for the vis.js network graph -->
        <div id="network-container"></div>
        
        <!-- Legend overlay -->
        <div class="absolute bottom-6 right-6 bg-white/90 backdrop-blur px-4 py-3 rounded-lg shadow-lg text-sm border border-slate-200 pointer-events-none">
            <h4 class="font-semibold mb-2 text-slate-700">Legend</h4>
            <div class="flex items-center gap-2 mb-1">
                <div class="w-6 h-1 bg-blue-300"></div> <span>Default Path</span>
            </div>
            <div class="flex items-center gap-2 mb-1">
                <div class="w-6 h-1.5 bg-red-500"></div> <span>Shortest Path</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-6 h-1.5 bg-green-500"></div> <span>MST Network</span>
            </div>
        </div>
    </main>

    <script>
        // Define standard styles for edges
        const DEFAULT_EDGE_COLOR = '#93c5fd'; // Tailwind blue-300
        const DEFAULT_EDGE_WIDTH = 2;
        const HIGHLIGHT_PATH_COLOR = '#ef4444'; // Tailwind red-500
        const HIGHLIGHT_MST_COLOR = '#22c55e'; // Tailwind green-500
        const HIGHLIGHT_WIDTH = 5;

        // Node highlight styles for animation
        const DEFAULT_NODE_BG = '#f8fafc';
        const DEFAULT_NODE_BORDER = '#cbd5e1';
        const HIGHLIGHT_NODE_BG = '#dcfce7'; // Tailwind green-100
        const HIGHLIGHT_NODE_BORDER = '#22c55e'; // Tailwind green-500

        // Raw Graph Data from user
        const rawNodes = [
            { id: 0, label: "Rupsha Ferry Ghat" },
            { id: 1, label: "Khulna Court" },
            { id: 2, label: "South Central More" },
            { id: 3, label: "Dakbangla More" },
            { id: 4, label: "Royal More" },
            { id: 5, label: "Moylapota More" },
            { id: 6, label: "Gollamari More" },
            { id: 7, label: "Shibbari More" },
            { id: 8, label: "Sonadanga" },
            { id: 9, label: "Boyra Bazar" },
            { id: 10, label: "Daulatpur" },
            { id: 11, label: "Shiromoni" }
        ];

        // Ensure edges have unique string IDs so vis can update them easily
        const rawEdges = [
            { id: 'e1', from: 0, to: 1, weight: 2.5, label: "2.5 km" },
            { id: 'e2', from: 1, to: 2, weight: 0.8, label: "0.8 km" },
            { id: 'e3', from: 1, to: 3, weight: 1.2, label: "1.2 km" },
            { id: 'e4', from: 2, to: 4, weight: 1.0, label: "1.0 km" },
            { id: 'e5', from: 3, to: 4, weight: 1.1, label: "1.1 km" },
            { id: 'e6', from: 4, to: 5, weight: 1.3, label: "1.3 km" },
            { id: 'e7', from: 5, to: 6, weight: 1.8, label: "1.8 km" },
            { id: 'e8', from: 4, to: 7, weight: 1.4, label: "1.4 km" },
            { id: 'e9', from: 5, to: 8, weight: 2.4, label: "2.4 km" },
            { id: 'e10', from: 6, to: 8, weight: 2.2, label: "2.2 km" },
            { id: 'e11', from: 7, to: 8, weight: 1.6, label: "1.6 km" },
            { id: 'e12', from: 7, to: 9, weight: 2.8, label: "2.8 km" },
            { id: 'e13', from: 8, to: 9, weight: 2.5, label: "2.5 km" },
            { id: 'e14', from: 9, to: 10, weight: 4.2, label: "4.2 km" },
            { id: 'e15', from: 7, to: 10, weight: 6.5, label: "6.5 km" },
            { id: 'e16', from: 10, to: 11, weight: 5.5, label: "5.5 km" }
        ];

        // Prepare vis-network DataSets
        const nodes = new vis.DataSet(rawNodes.map(n => ({
            ...n, 
            shape: 'dot',
            size: 16,
            font: { size: 14, face: 'Inter', bold: true, color: '#1e293b' },
            color: { background: '#f8fafc', border: '#cbd5e1', borderWidth: 2 }
        })));

        const edges = new vis.DataSet(rawEdges.map(e => ({
            ...e,
            font: { align: 'top', size: 12, color: '#475569', strokeWidth: 3, strokeColor: '#ffffff' },
            color: { color: DEFAULT_EDGE_COLOR },
            width: DEFAULT_EDGE_WIDTH
        })));

        let network = null;
        let animationInterval = null; // Store interval for MST animation

        // Populate dropdowns and setup network on load
        window.onload = function() {
            const startSelect = document.getElementById('start-node');
            const endSelect = document.getElementById('end-node');
            
            rawNodes.forEach(node => {
                let option1 = new Option(node.label, node.id);
                let option2 = new Option(node.label, node.id);
                startSelect.add(option1);
                endSelect.add(option2);
            });
            
            // Set default end node to Shiromoni for convenience
            endSelect.value = "11";

            const container = document.getElementById('network-container');
            const data = { nodes: nodes, edges: edges };
            const options = {
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -100,
                        centralGravity: 0.01,
                        springLength: 150,
                        springConstant: 0.08
                    }
                },
                interaction: { hover: true, tooltipDelay: 200 }
            };
            
            network = new vis.Network(container, data, options);
            
            // Bind button events
            document.getElementById('btn-reset').addEventListener('click', resetGraph);
            document.getElementById('btn-shortest-path').addEventListener('click', runDijkstra);
            document.getElementById('btn-mst').addEventListener('click', startMSTAnimation);
        };

        function resetGraph() {
            // Stop any ongoing animation
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }

            // Re-enable buttons if they were disabled
            document.getElementById('btn-shortest-path').disabled = false;
            document.getElementById('btn-mst').disabled = false;
            document.getElementById('btn-reset').disabled = false;

            // Reset edge styles
            const edgeUpdates = rawEdges.map(e => ({
                id: e.id, 
                color: { color: DEFAULT_EDGE_COLOR }, 
                width: DEFAULT_EDGE_WIDTH
            }));
            edges.update(edgeUpdates);
            
            // Reset node styles
            const nodeUpdates = rawNodes.map(n => ({
                id: n.id,
                color: { background: DEFAULT_NODE_BG, border: DEFAULT_NODE_BORDER, borderWidth: 2 }
            }));
            nodes.update(nodeUpdates);
            
            // Hide result box
            document.getElementById('result-box').classList.add('hidden');
        }

        function showResult(title, distanceStr, details) {
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-value').innerText = distanceStr;
            document.getElementById('result-details').innerText = details;
            document.getElementById('result-box').classList.remove('hidden');
        }

        function runDijkstra() {
            resetGraph();
            const startId = parseInt(document.getElementById('start-node').value);
            const endId = parseInt(document.getElementById('end-node').value);

            if (startId === endId) {
                showResult("Shortest Path", "0.0 km", "Start and end locations are the same.");
                return;
            }

            // Initialization
            let distances = {};
            let previous = {};
            let unvisited = new Set();
            
            rawNodes.forEach(node => {
                distances[node.id] = Infinity;
                previous[node.id] = null;
                unvisited.add(node.id);
            });
            distances[startId] = 0;

            // Compute shortest path
            while(unvisited.size > 0) {
                // Find node with minimum distance in unvisited
                let minNode = null;
                for (let nodeId of unvisited) {
                    if (minNode === null || distances[nodeId] < distances[minNode]) {
                        minNode = nodeId;
                    }
                }

                if (distances[minNode] === Infinity || minNode === endId) break;
                unvisited.delete(minNode);

                // Check neighbors
                let neighbors = rawEdges.filter(e => e.from === minNode || e.to === minNode);
                for (let edge of neighbors) {
                    let neighborId = edge.from === minNode ? edge.to : edge.from;
                    
                    if (unvisited.has(neighborId)) {
                        let alt = distances[minNode] + edge.weight;
                        if (alt < distances[neighborId]) {
                            distances[neighborId] = alt;
                            previous[neighborId] = { node: minNode, edgeId: edge.id };
                        }
                    }
                }
            }

            // Reconstruct path
            let pathEdges = [];
            let currentNode = endId;
            let pathFound = false;

            while (previous[currentNode]) {
                pathEdges.push(previous[currentNode].edgeId);
                currentNode = previous[currentNode].node;
                if (currentNode === startId) {
                    pathFound = true;
                }
            }

            if (pathFound) {
                // Highlight edges
                const updates = pathEdges.map(id => ({
                    id: id,
                    color: { color: HIGHLIGHT_PATH_COLOR },
                    width: HIGHLIGHT_WIDTH
                }));
                edges.update(updates);

                let totalDist = distances[endId].toFixed(1);
                showResult("Dijkstra's Shortest Path", `${totalDist} km`, "Optimal route highlighted in red.");
            } else {
                showResult("Path Error", "--", "No valid path found between these nodes.");
            }
        }

        // Disjoint Set Union (Union-Find) for cycle detection
        class UnionFind {
            constructor(elements) {
                this.parent = {};
                elements.forEach(e => this.parent[e] = e);
            }
            find(i) {
                if (this.parent[i] === i) return i;
                return this.parent[i] = this.find(this.parent[i]);
            }
            union(i, j) {
                let rootI = this.find(i);
                let rootJ = this.find(j);
                if (rootI !== rootJ) {
                    this.parent[rootI] = rootJ;
                    return true;
                }
                return false;
            }
        }

        // Orchestrates the algorithm selection and animation process
        function startMSTAnimation() {
            resetGraph();
            const algo = document.getElementById('mst-algo').value;
            let steps = [];
            let title = "";

            if (algo === 'kruskal') {
                steps = getKruskalSteps();
                title = "Optimal CNG Network (Kruskal's MST)";
            } else {
                steps = getPrimSteps();
                title = "Optimal CNG Network (Prim's MST)";
            }

            animateMST(steps, title);
        }

        // Kruskal's Logic: Returns edges in the order they should be added
        function getKruskalSteps() {
            let sortedEdges = [...rawEdges].sort((a, b) => a.weight - b.weight);
            let nodeIds = rawNodes.map(n => n.id);
            let uf = new UnionFind(nodeIds);
            
            let mstSteps = [];
            for (let edge of sortedEdges) {
                if (uf.union(edge.from, edge.to)) {
                    mstSteps.push(edge);
                }
                if (mstSteps.length === rawNodes.length - 1) break;
            }
            return mstSteps;
        }

        // Prim's Logic: Returns edges in the order they should be added
        function getPrimSteps() {
            let mstSteps = [];
            let visited = new Set();
            visited.add(0); // Start arbitrarily from Node 0 (Rupsha Ferry Ghat)
            
            let unvisited = new Set(rawNodes.map(n => n.id));
            unvisited.delete(0);
            
            while(unvisited.size > 0) {
                let minEdge = null;
                // Find shortest edge crossing the cut from visited to unvisited
                for (let edge of rawEdges) {
                    let hasFrom = visited.has(edge.from);
                    let hasTo = visited.has(edge.to);
                    
                    if (hasFrom !== hasTo) { // Exactly one node is in visited
                        if (!minEdge || edge.weight < minEdge.weight) {
                            minEdge = edge;
                        }
                    }
                }
                if (!minEdge) break; // Safety check for disconnected graphs
                
                mstSteps.push(minEdge);
                visited.add(minEdge.from);
                visited.add(minEdge.to);
                unvisited.delete(minEdge.from);
                unvisited.delete(minEdge.to);
            }
            return mstSteps;
        }

        // Animates the MST generation step-by-step
        function animateMST(steps, title) {
            // Disable control buttons during animation
            document.getElementById('btn-shortest-path').disabled = true;
            document.getElementById('btn-mst').disabled = true;
            
            let currentStep = 0;
            let totalInfrastructureCost = 0;
            
            showResult(title, "0.0 km", "Initializing algorithm animation...");

            animationInterval = setInterval(() => {
                if (currentStep >= steps.length) {
                    // Animation complete
                    clearInterval(animationInterval);
                    animationInterval = null;
                    document.getElementById('btn-shortest-path').disabled = false;
                    document.getElementById('btn-mst').disabled = false;
                    
                    showResult(
                        title, 
                        `${totalInfrastructureCost.toFixed(1)} km`, 
                        "Network established! All locations connected optimally."
                    );
                    return;
                }

                let edge = steps[currentStep];
                totalInfrastructureCost += edge.weight;

                // 1. Highlight the edge
                edges.update({
                    id: edge.id,
                    color: { color: HIGHLIGHT_MST_COLOR },
                    width: HIGHLIGHT_WIDTH
                });

                // 2. Highlight the connected nodes
                nodes.update([
                    { id: edge.from, color: { background: HIGHLIGHT_NODE_BG, border: HIGHLIGHT_NODE_BORDER, borderWidth: 3 } },
                    { id: edge.to, color: { background: HIGHLIGHT_NODE_BG, border: HIGHLIGHT_NODE_BORDER, borderWidth: 3 } }
                ]);

                // 3. Update status text
                let fromLabel = rawNodes.find(n => n.id === edge.from).label;
                let toLabel = rawNodes.find(n => n.id === edge.to).label;

                showResult(
                    title, 
                    `${totalInfrastructureCost.toFixed(1)} km`, 
                    `Step ${currentStep + 1}: Connecting ${fromLabel} & ${toLabel} (+${edge.weight} km)`
                );

                currentStep++;
            }, 800); // 800 milliseconds delay between steps
        }
    </script>
</body>
</html>
